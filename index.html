<!-- Chèn thư viện Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Khởi tạo Supabase Client
  const SUPABASE_URL = 'https://your-project.supabase.co';
  const SUPABASE_KEY = 'your-anon-key';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 2. Hàm tải danh sách sản phẩm động từ Database
  async function fetchProducts() {
    const { data, error } = await supabase.from('products').select('*');
    if (error) console.error(error);
    else {
      // Render dữ liệu vào <tbody> của Tab Mua Sắm tại đây
    }
  }

  // 3. Lắng nghe Realtime (Đồng bộ tức thì với App Mobile)
  supabase
    .channel('schema-db-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
      fetchProducts(); // Tự động load lại dữ liệu khi Mobile có thao tác
    })
    .subscribe();
</script>
